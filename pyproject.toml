[project]
name = "steaminlinebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "babel>=2.18.0",
    "beautifulsoup4>=4.15.0",
    "gazpacho>=1.1",
    "pydantic>=2.13.4",
    "python-telegram-bot>=22.8",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.22",
]

[project.scripts]
steaminlinebot = "steaminlinebot.app.main:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
